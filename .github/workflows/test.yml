name: Test Gnuplot Online
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/test.yml@v0.3.1
    with:
      kit-path: vendor/fragment-kit-v0.3.1
      contract-config: testing-contract.config.mjs
      browser-command: node tests/browser/url-state.cjs && node tests/browser/all.cjs http://127.0.0.1:8000/ "$BROWSER"
  kit:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/kit-check.yml@v0.3.1
    with:
      kit-path: vendor/fragment-kit-v0.3.1
